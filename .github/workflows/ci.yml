name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run unit and integration tests
        run: pio test -e native

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-esp32c3-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build release firmware
        run: pio run -e esp32c3_supermini

      - name: Build debug firmware
        run: pio run -e esp32c3_supermini_debug

      - name: Upload firmware image
        uses: actions/upload-artifact@v7
        with:
          name: kart-gps-firmware
          path: .pio/build/esp32c3_supermini/firmware.bin
          if-no-files-found: error

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # --skip-packages keeps the Arduino core and NimBLE out of the report,
      # which would otherwise bury our own findings in third-party ones.
      # Low severity findings are advisory: cppcheck cannot see that Arduino
      # calls setup() and loop(), or that NimBLE calls the callbacks.
      - name: Run cppcheck
        run: pio check -e native --skip-packages --fail-on-defect medium --fail-on-defect high
