; PlatformIO project configuration
;
; Two kinds of environment live here:
;   esp32c3_*  build and flash the firmware for the ESP32-C3 Super Mini
;   native     compile the hardware independent libraries and run their tests
;              on the host, which is what CI does on every push
;
; Run the tests with:  pio test -e native
; Build the firmware with:  pio run -e esp32c3_supermini

[platformio]
name = kart-gps
description = 25 Hz GPS and IMU telemetry over BLE for RaceChrono, on an ESP32-C3
default_envs = esp32c3_supermini

[env]
test_framework = unity

; ---------------------------------------------------------------------------
; Firmware
; ---------------------------------------------------------------------------

[esp32c3_base]
platform = espressif32 @ ^6.9.0
framework = arduino
; The Super Mini carries an ESP32-C3FH4 (4 MB flash, no PSRAM); the DevKitM-1
; definition matches it and is the one PlatformIO ships.
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder
lib_deps =
	h2zero/NimBLE-Arduino @ ^2.2.3
build_flags =
	-std=gnu++17
	; The Super Mini exposes only native USB, so the console has to be CDC.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; NimBLE is configured for a single peripheral connection: no central role,
	; no observer, no scanning. This is what keeps the stack inside the C3's RAM.
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	; Accelerometer trim correction, in raw counts, for the sensor on THIS
	; board. The part reports WHO_AM_I 0x72 rather than the MPU-6050's 0x68 and
	; its factory zero trim is badly off: uncorrected, a stationary board reads
	; 0.63 g instead of 1.00 g, which the zeroing rightly refuses. Scale is
	; fine, measured at 101-104% of nominal on all three axes.
	;
	; These belong to the individual sensor, not to the design. Swap the module
	; and they are wrong: re-measure with the console 'c' command, which prints
	; the replacements. See docs/hardware.md.
	-DKARTGPS_ACCEL_OFFSET_X=-6344
	-DKARTGPS_ACCEL_OFFSET_Y=5123
	-DKARTGPS_ACCEL_OFFSET_Z=-779
build_unflags = -std=gnu++11

[env:esp32c3_supermini]
extends = esp32c3_base
build_type = release
build_flags =
	${esp32c3_base.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-DKARTGPS_LOG_LEVEL=1
	-Os

[env:esp32c3_supermini_debug]
extends = esp32c3_base
build_type = debug
build_flags =
	${esp32c3_base.build_flags}
	-DCORE_DEBUG_LEVEL=4
	-DKARTGPS_LOG_LEVEL=4
	-DKARTGPS_ENABLE_NMEA_ECHO=1

; ---------------------------------------------------------------------------
; Host tests
; ---------------------------------------------------------------------------

[env:native]
platform = native
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-DKARTGPS_HOST_BUILD=1
debug_test = *
